name: Simulateur PC de Jo

# Recree le PC de Jo sur un runner Windows jetable et y lance les vrais scripts du repo
# (scripts/sim/Test-JoPc.ps1). Rien ne sort du runner : "origin" y est un depot nu local.
on:
  push:
    branches: [francis-dev, Estimateur-2, estimateur-junior]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jo-pc:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: mise (comme sur le PC de Jo)
        shell: pwsh
        run: |
          winget --version 2>$null
          if ($LASTEXITCODE -eq 0) {
            winget install --id jdx.mise -e --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          } else {
            choco install mise -y --no-progress
          }
          $shims = Join-Path $env:LOCALAPPDATA 'mise\shims'
          New-Item -ItemType Directory -Force -Path $shims | Out-Null
          $shims | Add-Content $env:GITHUB_PATH
          $miseExe = Get-Command mise -ErrorAction SilentlyContinue
          if (-not $miseExe) {
            $found = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages", "$env:ProgramData\chocolatey\bin" -Recurse -Filter mise.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            Split-Path $found.FullName | Add-Content $env:GITHUB_PATH
          }

      - name: Claude Code (version de config/VERSIONS.md)
        shell: pwsh
        run: |
          $v = (Select-String -Path config\VERSIONS.md -Pattern '^\| `claude --version` \| ([0-9.]+)').Matches[0].Groups[1].Value
          & ([scriptblock]::Create((Invoke-RestMethod https://claude.ai/install.ps1))) $v
          Join-Path $env:USERPROFILE '.local\bin' | Add-Content $env:GITHUB_PATH

      - name: Simulateur
        shell: pwsh
        env:
          SIM_OUT: ${{ runner.temp }}\sim-out
          ANTHROPIC_API_KEY: ${{ secrets.SIM_ANTHROPIC_API_KEY }}
        run: pwsh -NoProfile -File scripts\sim\Test-JoPc.ps1

      - name: Journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jo-pc-sim-logs
          path: ${{ runner.temp }}\sim-out

  # Test de bout en bout de code-rag contre de vrais Qdrant + Ollama Windows (comme sur le PC de Jo),
  # avec le meme modele d'embeddings (qwen3-embedding:8b). Ailleurs ce test est toujours saute.
  code-rag-integration:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Qdrant + Ollama
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $t = $env:RUNNER_TEMP
          function Get-Asset($repo, $pattern) {
            $rel = Invoke-RestMethod "https://api.github.com/repos/$repo/releases/latest" -Headers @{ Authorization = "Bearer ${{ github.token }}" }
            $a = $rel.assets | Where-Object name -match $pattern | Select-Object -First 1
            $dst = Join-Path $t $a.name
            Invoke-WebRequest $a.browser_download_url -OutFile $dst
            $dst
          }
          Expand-Archive (Get-Asset 'qdrant/qdrant' 'x86_64-pc-windows-msvc\.zip$') "$t\qdrant"
          Expand-Archive (Get-Asset 'ollama/ollama' '^ollama-windows-amd64\.zip$') "$t\ollama"
          $qd = Get-ChildItem "$t\qdrant" -Recurse -Filter qdrant.exe | Select-Object -First 1
          $ol = Get-ChildItem "$t\ollama" -Recurse -Filter ollama.exe | Select-Object -First 1
          Start-Process $qd.FullName -WorkingDirectory $qd.DirectoryName -RedirectStandardOutput "$t\qdrant.log" -RedirectStandardError "$t\qdrant.err"
          Start-Process $ol.FullName -ArgumentList serve -RedirectStandardOutput "$t\ollama.log" -RedirectStandardError "$t\ollama.err"
          $deadline = (Get-Date).AddMinutes(3)
          do {
            Start-Sleep 2
            $up = $true
            try { Invoke-RestMethod http://localhost:6333/healthz | Out-Null; Invoke-RestMethod http://localhost:11434/api/tags | Out-Null } catch { $up = $false }
          } until ($up -or (Get-Date) -gt $deadline)
          if (-not $up) { throw 'Qdrant ou Ollama ne repond pas' }
          & $ol.FullName pull qwen3-embedding:8b
          if ($LASTEXITCODE) { throw 'ollama pull a echoue' }

      - name: code-rag - test d'integration (Qdrant + Ollama reels)
        shell: pwsh
        run: |
          uv run --project code-rag pytest -v -m integration -rs code-rag 2>&1 | Tee-Object "$env:RUNNER_TEMP\integration.log"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (Select-String -Path "$env:RUNNER_TEMP\integration.log" -Pattern 'SKIPPED' -Quiet) { throw 'Test d''integration saute : services absents' }
