[project]
name = "plan-tools"
version = "0.1.0"
description = "Lecture des fichiers Plan Expert (.qpl) : inventaire, bordereau (BOM), aller-retour fidele."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.3",
    "pillow>=12.3.0",
    "typer>=0.27.2",
]

[project.scripts]
plan-tools = "plan_tools.cli:app"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
