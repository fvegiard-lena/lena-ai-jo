# plan-tools — règles du tracé automatique des conduits (commande `route`).
# Expressions régulières Python (module `re`), écrites en chaînes littérales TOML ('...').
# Fichier lu par défaut ; autre fichier : variable d'environnement PLAN_TOOLS_CONFIG.

[classify]
# Rôle de chaque symbole (Counter/@Name), évalué dans l'ordre : ignore → panel → device.
# Pas de conduit neuf : symboles à enlever (ENL, enlever, démolir, retirer) ou existants.
# Prioritaire sur panel : « PANN 30CCT ENL » est ignoré (attention : un panneau existant
# aussi — aucun cas réel hormis « PANN INCENDIE EXISTANT »).
ignore = '(?i)\bENL\b|enlev|d[ée]mol|retir|exist'
# Panneaux = points de départ des parcours. Panneaux d'alarme incendie exclus
# (annonciateur, TCAI, incendie, alarme) ; LP / DP seulement suivis d'un numéro (LP-1, DP2).
panel = '(?i)\bpann(eau)?\b(?!.*(annonciateur|tcai|incendie|alarme))|\bPNL\b|\bLP-?\d|\bDP-?\d|distribution|\bCDP\b|\bMCC\b|main disj'
# Jamais panneau, même si `panel` correspond (faux positifs relevés sur les 371 fichiers réels) :
# luminaires (FIXT…, TYPE LP1A), détecteurs (DETECTEUR DP1), alarme / feu / annonciateur
# (PANN FEU, PANN ALARM, Pann Ann), Bell (PANN BEL), panneaux de contrôle (PANN CONTROL…),
# CO / monoxyde, SUPPORT A PANN, poteaux « pann cam », à enlever ; « DP » seul.
panel_exclude = '(?i)^FIXT|\bTYPE\b|DETECTEUR|\bFEU\b|\bALARM|\bANN\b|\bBELL?\b|\bENL\b|enlev|CONTROL|MONOXIDE|\bCO\b|SUPPORT|\bcam\b|^DP$'
# Appareils : tout le reste (nom non vide).
device = '\S'

[circuit]
# Étiquette de circuit cherchée dans Counter/@Name puis Counter/@Text (sensible à la casse).
tag = '\b[A-Z]{1,3}-?\d{1,3}\b'
# Sans étiquette (ou étiquette trop chargée) : regroupement par proximité, plus proche voisin
# glouton, au plus N appareils par parcours.
max_devices_per_run = 12

[route]
# Line existantes traitées comme conduits (nom de l'objet ou description du catalogue).
conduit_line = '(?i)conduit'
# Article du catalogue (Group/EEExchangeData/@Description) dont le GroupID est repris.
conduit_group = '(?i)conduit.*3/4'
# Deux segments parallèles à moins de N px l'un de l'autre sont « superposés ».
overlap_tolerance_px = 4

